[project]
name = "smart-grid-data-platform"
version = "0.1.0"
description = "Simulated smart-grid energy monitoring and daily household billing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.1",
    "fastapi>=0.136.3",
    "psycopg2-binary>=2.9.13",
    "pyspark==3.5.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
