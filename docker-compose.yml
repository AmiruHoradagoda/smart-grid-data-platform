services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: smart-grid-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        PLAINTEXT://:29092,
        PLAINTEXT_HOST://:9092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - smart-grid-network

  spark:
    build:
      context: ./src/streaming
    image: smart-grid-spark:3.5.1
    container_name: smart-grid-spark

    environment:
      PYTHONPATH: /opt/spark-apps

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

    volumes:
      - ./src:/opt/spark-apps
      - ./utils:/opt/spark-apps/utils
      - ./config:/opt/spark-apps/config
      - spark-checkpoints:/opt/spark-checkpoints

    command:
      [
        "/opt/spark/bin/spark-submit",
        "--conf",
        "spark.jars.ivy=/tmp/.ivy2",
        "--packages",
        "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.4",
        "/opt/spark-apps/streaming/smart_meter_stream.py",
      ]

    networks:
      - smart-grid-network

  postgres:
    image: postgres:16
    container_name: smart-grid-postgres

    environment:
      POSTGRES_DB: smart_grid
      POSTGRES_USER: smartgrid
      POSTGRES_PASSWORD: smartgrid

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgrid -d smart_grid"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - smart-grid-network

  airflow:
    image: apache/airflow:3.3.1
    container_name: smart-grid-airflow

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://smartgrid:smartgrid@postgres:5432/airflow_meta"

      PYTHONPATH: /opt/airflow/project

      _PIP_ADDITIONAL_REQUIREMENTS: >
        psycopg2-binary
        pyyaml

    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/project/config
      - ./utils:/opt/airflow/project/utils
      - airflow-data:/opt/airflow

    command: standalone

    ports:
      - "8080:8080"

    networks:
      - smart-grid-network

networks:
  smart-grid-network:
    name: smart-grid-network

volumes:
  postgres-data:
  airflow-data:
  spark-checkpoints:
