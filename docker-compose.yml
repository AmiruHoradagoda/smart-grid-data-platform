services:

  kafka:
    image: apache/kafka:3.9.0
    container_name: smart-grid-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        PLAINTEXT://:29092,
        PLAINTEXT_HOST://:9092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - smart-grid-network


  spark:
    image: apache/spark:3.5.1
    container_name: smart-grid-spark

    depends_on:
      kafka:
        condition: service_healthy

    volumes:
      - ./src:/opt/spark-apps

    command:
      [
        "/opt/spark/bin/spark-submit",
        "--conf",
        "spark.jars.ivy=/tmp/.ivy2",
        "--packages",
        "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1",
        "/opt/spark-apps/streaming/smart_meter_stream.py"
      ]

    networks:
      - smart-grid-network

networks:
  smart-grid-network:
    name: smart-grid-network

